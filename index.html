<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница</title>
    <!-- Менеджер тегов Альткрафт (тот же контейнер, что и в кейсе с попапом) -->
    <script>
        (function (window, document, dataLayerName, containerID) {
            window[dataLayerName] = window[dataLayerName] || [];
            window[dataLayerName].push({ 'start': new Date().getTime(), event: 'actm-js' });
            var firstScript = document.getElementsByTagName('script')[0];
            var script = document.createElement('script');
            var dl = dataLayerName !== 'acDataLayer' ? '&l=' + dataLayerName : '';
            script.async = true;
            script.src = 'https://pxl.ru.altkraft.com/actm/js/actm.js?id=' + containerID + dl;
            script.type = 'module';
            if (firstScript && firstScript.parentNode) {
                firstScript.parentNode.insertBefore(script, firstScript);
            }
        }(window, document, 'acDataLayer', 'ATM-73FBaBDiakioNyIjy'));
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .ak-form {
            text-align: left;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
        }

        .ak-form h2 {
            margin: 0 0 16px;
            font-size: 20px;
            color: #333;
        }

        .ak-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .ak-option label {
            cursor: pointer;
        }

        .ak-form button {
            margin-top: 16px;
            padding: 10px 24px;
            background: #4a90d9;
            color: #fff;
            border: 0;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, это тестовая страница</h1>

        <!-- Итоговая форма: только вопросы. Ответы никуда не отправляются:
             адрес отправки не задан, при нажатии «Отправить» страница
             просто перезагружается с выбранным значением в адресе. -->
        <form id="ak-form" class="ak-form">
            <h2>Почему Вы решили отписаться от всех рассылок?</h2>

            <div class="ak-option">
                <input type="radio" id="opt1" name="field_11" value="Вариант 1" required>
                <label for="opt1">Вариант 1</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt2" name="field_11" value="Вариант 2">
                <label for="opt2">Вариант 2</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt3" name="field_11" value="Вариант 3">
                <label for="opt3">Вариант 3</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt4" name="field_11" value="Вариант 4">
                <label for="opt4">Вариант 4</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt5" name="field_11" value="Вариант 5">
                <label for="opt5">Вариант 5</label>
            </div>

            <button type="submit">Отправить</button>
        </form>

        <div id="ak-status" style="margin-top:12px;font-size:14px;color:#666;"></div>
    </div>

    <script>
        // ---- Передача ответа формы в платформу через Менеджер тегов ----
        // При отправке формы ответ кладётся в data layer: событие unsub_answer,
        // поле answer со значением выбранного варианта и поле user_id
        // (значение параметра user_id из адреса страницы — по нему Менеджер тегов
        // найдёт профиль в платформе через пиксель).
        // Вся остальная настройка — в интерфейсе платформы (Менеджер тегов):
        // переменные уровня данных, триггер «Специальное событие» и тег
        // «Пользовательский HTML» с кодом пикселя.
        document.getElementById('ak-form').addEventListener('submit', function (e) {
            // Страница не перезагружается, чтобы запрос цели успел уйти в платформу
            e.preventDefault();
            var checked = document.querySelector('input[name="field_11"]:checked');
            if (!checked) return;
            acDataLayer.push({
                event: 'unsub_answer',
                answer: checked.value,
                user_id: new URLSearchParams(location.search).get('user_id') || ''
            });
            document.getElementById('ak-status').textContent =
                'Ответ передан в платформу: ' + checked.value;
            // Отладка (в итоговой версии убрать): состояние data layer после отправки
            try {
                var dlInfo = [];
                for (var di = 0; di < acDataLayer.length; di++) {
                    dlInfo.push((acDataLayer[di] || {}).event || 'obj');
                }
                document.getElementById('ak-status').setAttribute('data-dl', dlInfo.join('|'));
            } catch (err) {}
        });
    </script>
</body>
</html>
