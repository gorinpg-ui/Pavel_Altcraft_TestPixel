<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .ak-form {
            text-align: left;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
        }

        .ak-form h2 {
            margin: 0 0 16px;
            font-size: 20px;
            color: #333;
        }

        .ak-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        .ak-option label {
            cursor: pointer;
        }

        .ak-form button {
            margin-top: 16px;
            padding: 10px 24px;
            background: #4a90d9;
            color: #fff;
            border: 0;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, это тестовая страница</h1>

        <!-- Итоговая форма: только вопросы. Ответы никуда не отправляются:
             адрес отправки не задан, при нажатии «Отправить» страница
             просто перезагружается с выбранным значением в адресе. -->
        <form class="ak-form">
            <h2>Почему Вы решили отписаться от всех рассылок?</h2>

            <div class="ak-option">
                <input type="radio" id="opt1" name="field_11" value="Вариант 1" required>
                <label for="opt1">Вариант 1</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt2" name="field_11" value="Вариант 2">
                <label for="opt2">Вариант 2</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt3" name="field_11" value="Вариант 3">
                <label for="opt3">Вариант 3</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt4" name="field_11" value="Вариант 4">
                <label for="opt4">Вариант 4</label>
            </div>
            <div class="ak-option">
                <input type="radio" id="opt5" name="field_11" value="Вариант 5">
                <label for="opt5">Вариант 5</label>
            </div>

            <button type="submit">Отправить</button>
        </form>
    </div>
</body>
</html>
